---
- name: macOS - Check for Homebrew (Apple Silicon)
  stat:
    path: /opt/homebrew/bin/brew
  register: homebrew_arm_check

- name: macOS - Check for Homebrew (Intel)
  stat:
    path: /usr/local/bin/brew
  register: homebrew_intel_check

- name: macOS - Set Homebrew installed fact
  set_fact:
    homebrew_installed: "{{ homebrew_arm_check.stat.exists or homebrew_intel_check.stat.exists }}"

- name: macOS - Install Homebrew
  shell: |
    NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not homebrew_installed
  become: yes
  environment:
    CI: "1"

- name: macOS - Add Homebrew to PATH (Apple Silicon)
  lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zprofile"
    line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
    create: yes
  when: homebrew_arm_check.stat.exists or (not homebrew_installed and ansible_facts['machine'] == "arm64")

- name: macOS - Add Homebrew to PATH (Intel)
  lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zprofile"
    line: 'eval "$(/usr/local/bin/brew shellenv)"'
    create: yes
  when: homebrew_intel_check.stat.exists and not homebrew_arm_check.stat.exists

- name: macOS - Update Homebrew
  homebrew:
    update_homebrew: yes
  ignore_errors: yes
  when: homebrew_installed
  become: no

- name: macOS - Install Homebrew packages
  homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ common_tools.brew_packages }}"
  when: common_tools.brew_packages is defined
  become: no

- name: macOS - Install Homebrew Cask applications
  homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ common_tools.brew_cask_packages }}"
  when: common_tools.brew_cask_packages is defined
  ignore_errors: yes
  become: no

- name: macOS - Configure shell (zsh)
  block:
    - name: macOS - Get actual user for shell config
      set_fact:
        actual_user: "{{ lookup('env', 'USER') }}"
      become: no

    - name: macOS - Install and configure Oh My Zsh
      block:
        - name: macOS - Check if Oh My Zsh is already installed
          stat:
            path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
          register: ohmyzsh_check
          become: no

        - name: macOS - Install Oh My Zsh
          shell: |
            sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
          args:
            creates: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
          when: not ohmyzsh_check.stat.exists
          become: no
          environment:
            HOME: "{{ ansible_facts['user_dir'] }}"

        - name: macOS - Install custom Oh My Zsh plugins
          include_tasks: install_ohmyzsh_plugin.yml
          loop: "{{ ohmyzsh_custom_plugins }}"
          when: 
            - ohmyzsh_custom_plugins is defined
            - ohmyzsh_custom_plugins | length > 0
      when: install_ohmyzsh

    - name: macOS - Configure zshrc
      template:
        src: zshrc.j2
        dest: "~{{ actual_user }}/.zshrc"
        backup: yes
        mode: '0644'
      become: no

- name: macOS - Set zsh as default shell
  shell: chsh -s /bin/zsh
  become: yes
  when: ansible_facts['user_shell'] | default('') != "/bin/zsh"
  failed_when: false

- name: macOS - Get the actual user (not root)
  set_fact:
    actual_user: "{{ lookup('env', 'USER') }}"
  become: no

- name: macOS - Deploy Ansible user configuration
  template:
    src: ansible.cfg.j2
    dest: "~{{ actual_user }}/.ansible.cfg"
    mode: '0644'
    backup: yes
  become: no

- name: macOS - Create ansible directory
  file:
    path: "~{{ actual_user }}/ansible"
    state: directory
    mode: '0755'
  become: no

- name: macOS - Deploy Ansible development configuration
  template:
    src: ansible_dev.cfg.j2
    dest: "~{{ actual_user }}/ansible/.ansible.cfg"
    mode: '0644'
    backup: yes
  become: no

- name: macOS - Configure git
  block:
    - name: macOS - Set git global config
      git_config:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      loop:
        - { name: "pull.rebase", value: "false" }
        - { name: "init.defaultBranch", value: "main" }
        - { name: "core.editor", value: "{{ preferred_editor }}" }

- name: macOS - Install Docker Desktop
  homebrew_cask:
    name: docker
    state: present
  ignore_errors: yes
  become: no

- name: macOS - Configure Ghostty
  block:
    - name: macOS - Check if Ghostty is installed
      stat:
        path: /Applications/Ghostty.app
      register: ghostty_check

    - name: macOS - Create Ghostty config directory
      file:
        path: "~{{ actual_user }}/.config/ghostty"
        state: directory
        mode: '0755'
      when: ghostty_check.stat.exists
      become: no

    - name: macOS - Deploy Ghostty configuration
      template:
        src: ghostty.conf.j2
        dest: "~{{ actual_user }}/.config/ghostty/config"
        mode: '0644'
        backup: yes
      when: ghostty_check.stat.exists
      become: no

- name: macOS - Configure iTerm2 as default SSH handler
  block:
    - name: macOS - Check if iTerm2 is installed
      stat:
        path: /Applications/iTerm.app
      register: iterm2_check

    - name: macOS - Set iTerm2 as default SSH handler
      shell: |
        /usr/bin/defaults write com.apple.LaunchServices/com.apple.launchservices.secure LSHandlers -array-add '{LSHandlerURLScheme=ssh;LSHandlerRoleAll=com.googlecode.iterm2;}'
      when: iterm2_check.stat.exists
      ignore_errors: yes
      become: no

    - name: macOS - Create iTerm2 DynamicProfiles directory
      file:
        path: "{{ ansible_facts['user_dir'] }}/Library/Application Support/iTerm2/DynamicProfiles"
        state: directory
        mode: '0755'
      when: iterm2_check.stat.exists

    - name: macOS - Deploy iTerm2 development profile
      template:
        src: iterm2_prefs.j2
        dest: "{{ ansible_facts['user_dir'] }}/Library/Application Support/iTerm2/DynamicProfiles/ansible_profile.json"
        mode: '0644'
      when: iterm2_check.stat.exists

    - name: macOS - Display iTerm2 configuration message
      debug:
        msg: "iTerm2 has been set as the default SSH:// URL handler and configured with a development profile. Restart iTerm2 to see changes."
      when: iterm2_check.stat.exists

- name: macOS - Manage custom hosts entries
  block:
    - name: macOS - Backup /etc/hosts
      copy:
        src: /etc/hosts
        dest: /etc/hosts.backup
        mode: '0644'
        remote_src: yes
      become: yes
      when: manage_custom_hosts

    - name: macOS - Add custom hosts entries
      lineinfile:
        path: /etc/hosts
        line: "{{ item.ip }}\t{{ item.hostname }}\t# {{ item.comment | default('Managed by Ansible') }}"
        regexp: "^{{ item.ip }}\\s+{{ item.hostname }}"
        state: present
        backup: yes
      loop: "{{ custom_hosts_entries }}"
      become: yes
      when: manage_custom_hosts and custom_hosts_entries is defined

    - name: macOS - Display hosts file info
      debug:
        msg: "Custom hosts entries have been added to /etc/hosts. Backup saved to /etc/hosts.backup"
      when: manage_custom_hosts and custom_hosts_entries is defined

- name: macOS - Configure Dock
  block:
    - name: macOS - Get actual user for Dock configuration
      set_fact:
        actual_user: "{{ lookup('env', 'USER') }}"
      become: no

    - name: macOS - Check if dockutil is available
      command: which dockutil
      register: dockutil_check
      failed_when: false
      changed_when: false
      become: no

    - name: macOS - Display Dock configuration status
      debug:
        msg: "{{ 'Configuring Dock for user ' + actual_user + ' with dockutil' if dockutil_check.rc == 0 else 'Skipping Dock configuration - dockutil not found (will be installed via Homebrew)' }}"
      become: no

    - name: macOS - Check if Dock items exist before removing
      command: dockutil --find '{{ item }}'
      loop: "{{ dockitems_remove }}"
      when: 
        - configure_dock
        - dockutil_check.rc == 0
        - dockitems_remove is defined
      register: dock_items_to_remove
      changed_when: false
      failed_when: false
      become: no

    - name: macOS - Remove unwanted Dock items
      shell: dockutil --remove '{{ item.item }}' --no-restart
      loop: "{{ dock_items_to_remove.results }}"
      when: 
        - configure_dock
        - dockutil_check.rc == 0
        - dockitems_remove is defined
        - item.rc is defined
        - item.rc == 0
      register: dock_remove_result
      changed_when: "'was removed' in dock_remove_result.stdout"
      failed_when: false
      become: no

    - name: macOS - Check if applications exist before adding
      stat:
        path: "{{ item.path }}"
      loop: "{{ dockitems_persist }}"
      register: app_exists
      when:
        - configure_dock
        - dockutil_check.rc == 0
        - dockitems_persist is defined
      become: no

    - name: macOS - Check if applications are already in Dock
      command: dockutil --find '{{ item.item.name }}'
      loop: "{{ app_exists.results }}"
      when:
        - configure_dock
        - dockutil_check.rc == 0
        - item.stat.exists
      register: dock_app_check
      changed_when: false
      failed_when: false
      become: no

    - name: macOS - Create list of apps already in Dock
      set_fact:
        apps_in_dock: "{{ apps_in_dock | default([]) + [item.item.item.name] }}"
      loop: "{{ dock_app_check.results | default([]) }}"
      when:
        - configure_dock
        - dockutil_check.rc == 0
        - item.rc is defined
        - item.rc == 0
      become: no

    - name: macOS - Add applications to Dock
      shell: dockutil --add '{{ item.item.path }}' --position {{ item.item.pos }} --no-restart
      loop: "{{ app_exists.results }}"
      when:
        - configure_dock
        - dockutil_check.rc == 0
        - item.stat.exists
        - item.item.name not in (apps_in_dock | default([]))
      register: dock_add_result
      changed_when: 
        - dock_add_result.rc == 0
        - "'already in' not in (dock_add_result.stderr | default(''))"
        - "'already in' not in (dock_add_result.stdout | default(''))"
        - "'added' in (dock_add_result.stdout | default(''))"
      failed_when: false
      become: no

    - name: macOS - Restart Dock
      command: killall Dock
      when:
        - configure_dock
        - dockutil_check.rc == 0
        - (dock_remove_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length > 0) or (dock_add_result.results | default([]) | selectattr('changed', 'equalto', true) | list | length > 0)
      changed_when: true
      become: no

