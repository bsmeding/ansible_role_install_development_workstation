---
- name: Check if custom plugin {{ item.name }} exists
  stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
  register: plugin_exists
  become: no

- name: Install custom plugin {{ item.name }}
  git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    update: yes
  become: no
  when: not plugin_exists.stat.exists

