---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check git is installed
      ansible.builtin.command: git --version
      register: git_version
      changed_when: false

    - name: Assert git is available
      ansible.builtin.assert:
        that:
          - git_version.rc == 0
          - "'git version' in git_version.stdout"

    # Role writes to user_dir; include /root for Docker where facts can disagree.
    - name: Check zshrc was deployed
      ansible.builtin.stat:
        path: "{{ item }}/.zshrc"
      loop: "{{ ([ansible_facts.get('user_dir', '/root')] + ['/root']) | unique | list }}"
      register: zshrc_stats

    - name: Assert zshrc exists
      ansible.builtin.assert:
        that:
          - zshrc_stats.results | selectattr('stat.exists') | list | length > 0
        fail_msg: >-
          No .zshrc under {{ ([ansible_facts.get('user_dir', '/root')] + ['/root']) | unique | list | join(', ') }}.
          user_dir={{ ansible_facts.get('user_dir', 'MISSING') }},
          user_id={{ ansible_facts.get('user_id', 'MISSING') }}.
