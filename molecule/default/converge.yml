---
# Slim vars for CI: full defaults pull in heavy apt/network steps; these keep
# converge within reasonable time while still exercising the Ubuntu path.
- name: Converge
  hosts: all
  vars:
    install_ohmyzsh: false
    manage_custom_hosts: false
    common_tools:
      pip:
        - packaging
      vscode_extensions: []
      debian_packages:
        - git
        - curl
        - wget
        - python3
        - python3-pip
        - python3-venv
        - ca-certificates
        - zsh
        - software-properties-common

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts.os_family == 'Debian'
      become: true

    - name: Wait for systemd to complete initialization
      ansible.builtin.command: systemctl is-system-running
      register: systemctl_status
      until: >
        'running' in systemctl_status.stdout or
        'degraded' in systemctl_status.stdout
      retries: 30
      delay: 5
      when: ansible_facts.service_mgr == 'systemd'
      changed_when: false
      failed_when: systemctl_status.rc > 1
      become: true

  roles:
    - role: ../../
