---
# Minimal fallbacks only. Define packages, dock, shell, and hosts in your
# playbook (e.g. vars_files: vars/workstation.yml) or inventory group_vars.

common_tools:
  pip: []
  vscode_extensions: []
  brew_packages: []
  brew_cask_packages: []
  debian_packages: []

manage_custom_hosts: false
custom_hosts_entries: []

configure_dock: false
dockitems_remove: []
dockitems_persist: []

preferred_editor: nano

os_settings:
  zsh: true
  bash: true
  environment_variables: []
  color_scheme: true

install_ohmyzsh: false
ohmyzsh_theme: robbyrussell
ohmyzsh_plugins: []
ohmyzsh_custom_plugins: []
